name: weather_app
description: "A weather application built with clean architecture."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization
  intl: ^0.20.2

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.7.1

  # Navigation
  go_router: ^17.3.0

  # Icons
  iconsax: ^0.0.8

  # Network
  dio: ^5.11.0

  # Preferences
  shared_preferences: ^2.5.3

  # Serialization
  json_annotation: ^4.12.0

  # Caching
  sqflite: ^2.4.2
  path: ^1.9.1
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.12.1
  build_runner: ^2.15.1
  json_serializable: ^6.11.1
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
